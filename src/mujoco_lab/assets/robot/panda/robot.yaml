controller:
  name: position
  gravity_compensation: true
  frame: grasp # ee_site

constraints:
  joint_names:
    - panda_joint1
    - panda_joint2
    - panda_joint3
    - panda_joint4
    - panda_joint5
    - panda_joint6
    - panda_joint7
  # [lower, upper] in degrees, converted from robot.xml.
  position_limit:
    - [-166.003061983253, 166.003061983253]
    - [-101.001000125662, 101.001000125662]
    - [-166.003061983253, 166.003061983253]
    - [-176.001175508286, -3.99924541001315]
    - [-166.003061983253, 166.003061983253]
    - [-1.00267614147894, 215.002412622841]
    - [-166.003061983253, 166.003061983253]
  # Units are rad/s and rad/s^2, in joint_names order.
  # Source: https://frankaemika.github.io/docs/control_parameters.html#limits-for-panda
  velocity_limit: [2.175, 2.175, 2.175, 2.175, 2.61, 2.61, 2.61]
  acceleration_limit: [15.0, 7.5, 10.0, 12.5, 15.0, 20.0, 20.0]

gripper:
  actuator: panda_finger_joint1
  # Configured gripper motion limits.
  velocity_limit: 0.2 # m/s
  acceleration_limit: 1.0 # m/s^2
