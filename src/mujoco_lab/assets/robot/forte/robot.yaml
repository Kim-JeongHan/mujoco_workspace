pose:
  # Seven arm angles in degrees, followed by the gripper opening width in meters (0 closed).
  default: [0, -90, 0, -90, 0, 90, 0, 0.074]
  zero: [0, 0, 0, 0, 0, 0, 0, 0.074]

controller:
  name: computed_torque
  natural_frequency: 80.0 # rad/s; acceleration Kp = 6400
  damping_ratio: 1.0 # acceleration Kd = 160
  gravity_compensation: true

# Previous torque PD configuration. Restore this block to switch back to PD.
# controller:
#   name: pd
#   gravity_compensation: true
#   frame: grasp
#   pd_gains:
#     shoulder_yaw:
#       kp: 147.0
#       kd: 11.8
#     shoulder_pitch:
#       kp: 222.0
#       kd: 17.8
#     shoulder_roll:
#       kp: 47.0
#       kd: 3.8
#     elbow_pitch:
#       kp: 74.0
#       kd: 5.9
#     lower_arm_roll:
#       kp: 6.8
#       kd: 0.55
#     wrist_pitch:
#       kp: 7.2
#       kd: 0.57
#     wrist_roll:
#       kp: 3.2
#       kd: 0.25

reference:
  name: analytic_jerk # analytic_jerk or min_jerk; updated at Simulator.dt.
  response_time: 0.15 # Analytic jerk: response time scale (s).
  horizon: 0.6 # Analytic jerk: prediction horizon (s).
  terminal_weight: 0.0 # Analytic jerk: terminal position-error weight.
  duration: 0.01 # Min jerk: minimum segment duration (s), independent of dt.
  constrain: true # Min jerk: extend duration to satisfy velocity/acceleration limits.

constraints:
  joint_names:
    - shoulder_yaw
    - shoulder_pitch
    - shoulder_roll
    - elbow_pitch
    - lower_arm_roll
    - wrist_pitch
    - wrist_roll
  # [lower, upper] in degrees, rounded to whole degrees in the new zero reference.
  position_limit:
    - [-10, 10]
    - [-180, 0]
    - [-150, 120]
    - [-454, 266]
    - [-368, 352]
    - [-287, 433]
    - [-368, 352]
  # Configured arm motion limits in rad/s and rad/s^2, in joint_names order.
  # Rated-load speeds with external reductions from the 3week meeting Hardware Spec.
  # shoulder_pitch uses the documented estimated 6:1 reduction.
  velocity_limit: [10.47, 1.75, 10.47, 10.47, 5.24, 5.24, 10.47]
  # Initial operating limits (rad/s^2), distinct from model acceleration maxima.
  # Checked against rated torques at 1,002 stationary, empty-hand poses with
  # open/closed fingers; moving states and payloads still require validation.
  acceleration_limit: [1.75, 1.75, 1.75, 1.75, 1.75, 1.75, 1.75]

gripper:
  actuator: gripper_motor
  joints: [gripper_left_joint, gripper_right_joint]
  # Native XML target range: 0 m closed, 0.037 m open.
  # Opening-width motion limits; native joint motion is half this rate.
  velocity_limit: 0.68 # m/s (opening width; rated-load kinematic estimate from HardwareSpec)
  acceleration_limit: 2.0 # m/s^2 (opening width)
