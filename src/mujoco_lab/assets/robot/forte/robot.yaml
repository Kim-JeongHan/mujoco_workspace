pose:
  # Seven arm angles in degrees, then total gripper opening in meters.
  default: [0, -90, 0, 90, 0, 90, 0, 0.048]
  zero: [0, 0, 0, 0, 0, 0, 0, 0.048]

controller:
  name: computed_torque
  natural_frequency: 80.0
  damping_ratio: 1.0
  gravity_compensation: true

reference:
  name: jerk_lqr
  response_time: 0.15
  horizon: 0.6
  terminal_weight: 0.0

constraints:
  joint_names:
    - shoulder_yaw
    - shoulder_pitch
    - shoulder_roll
    - elbow_pitch
    - lower_arm_roll
    - wrist_pitch
    - wrist_yaw
  # Native CAD travel in degrees. Motor and motion limits reuse the Forte case.
  position_limit:
    - [-170, 170]
    - [-180, 0]
    - [-170, 170]
    - [0, 140]
    - [-360, 360]
    - [-90, 120]
    - [-100, 100]
  velocity_limit: [1.75, 1.75, 10.47, 10.47, 5.24, 5.24, 10.47]
  acceleration_limit: [1.75, 1.75, 1.75, 1.75, 1.75, 1.75, 1.75]

gripper:
  actuator: gripper_motor
  joints: [gripper_left_joint, gripper_right_joint]
  velocity_limit: 0.68
  acceleration_limit: 2.0
