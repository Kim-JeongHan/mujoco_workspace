# yaml-language-server: $schema=./schema.json
# Close along world Y, near the home jaw orientation. The 35-degree tilt
# from vertical clears the elbow while avoiding a large initial wrist turn.
euler_xyz_degrees: [145.0, 0.0, -90.0]
frame: grasp
arm_max_velocity: 2.0 # rad/s; task tuning, not a motor rating
arm_max_acceleration: 8.0 # rad/s^2
gripper_max_velocity: 0.2 # m/s
gripper_max_acceleration: 1.0 # m/s^2
arm_tolerance: 0.016
gripper_tolerance: 0.001
stages:
  - name: above_pick
    offset_xyz_m: [0.0631, 0.0, 0.0981]
    gripper_target_m: 0.0
    min_duration_s: 0.36
  - name: pick
    # Back off 10 mm along the tool axis and raise 8 mm for finger-hull clearance.
    offset_xyz_m: [0.0057, 0.0, 0.0162]
    gripper_target_m: 0.0
    min_duration_s: 0.36
  - name: close
    offset_xyz_m: [0.0057, 0.0, 0.0162]
    gripper_target_m: -0.02
    min_duration_s: 0.3
    require_grasp: true
  - name: lift
    offset_xyz_m: [0.0057, 0.0, 0.1162]
    gripper_target_m: -0.02
    min_duration_s: 0.36
    arm_max_velocity: 0.8
    arm_max_acceleration: 4.0
    min_lift_height_m: 0.04
  - name: above_place
    offset_xyz_m: [0.0057, 0.0, 0.1162]
    gripper_target_m: -0.02
    min_duration_s: 0.36
    arm_max_velocity: 0.8
    arm_max_acceleration: 4.0
  - name: place
    offset_xyz_m: [0.0057, 0.0, 0.0162]
    gripper_target_m: -0.02
    min_duration_s: 0.36
    arm_max_velocity: 0.8
    arm_max_acceleration: 4.0
  - name: release
    offset_xyz_m: [0.0057, 0.0, 0.0162]
    gripper_target_m: 0.0
    min_duration_s: 0.3
  - name: retract
    offset_xyz_m: [0.0631, 0.0, 0.0981]
    gripper_target_m: 0.0
    min_duration_s: 0.36
