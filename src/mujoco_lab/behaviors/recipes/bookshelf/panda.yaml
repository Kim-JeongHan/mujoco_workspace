# [velocity ratio, acceleration ratio] of configured robot limits.
# Arm ratios keep every joint below the previous absolute task limits.
arm: [0.134, 0.05]
gripper: [0.125, 0.1]
waypoint_tolerance: 0.02
arm_tolerance: 0.025
stage_dwell_s: 0.4
stage_timeout_s: 12.0
lost_grasp_grace_s: 0.25
approach_distance_m: 0.032 # Back off along the pickup grasp's tool axis.
lift_height_m: 0.06
min_lift_height_m: 0.04
insertion_clearance_m: 0.04 # Height above the final shelf placement.
shelf_front_y_m: 0.43
preinsert_clearance_m: 0.03 # Keep the entire book in front of the opening.
retract_distance_m: 0.18
stages:
  - name: approach
    gripper_mode: 0
    arm: [0.2298, 0.05]
  - name: pick
    gripper_mode: 0
  - name: close
    gripper_mode: 1
  - name: lift
    gripper_mode: 1
  - name: preinsert
    gripper_mode: 1
  - name: insert
    gripper_mode: 1
  - name: lower
    gripper_mode: 1
  - name: release
    gripper_mode: 0
  - name: retract
    gripper_mode: 0
