# Keep the home grasp direction vertically downward and close along world Y.
euler_xyz_degrees: [180.0, 0.0, -90.0]
frame: grasp
# Gripper mode: 1 closes; 0 fully opens.
# [velocity ratio, acceleration ratio] of configured robot limits.
arm: [1.0, 1.0]
gripper: [1.0, 1.0]
arm_tolerance: 0.016
gripper_tolerance: 0.002
lost_grasp_grace_s: 0.25
stages:
  - name: above_pick
    # Approach directly above the cube, with 90 mm of tool-axis clearance.
    offset_xyz_m: [0.0, 0.0, 0.098]
    gripper_mode: 0
  - name: pick
    # Back off 10 mm along the tool axis and raise 8 mm for finger-hull clearance.
    offset_xyz_m: [0.0, 0.0, 0.018]
    gripper_mode: 0
  - name: close
    offset_xyz_m: [0.0, 0.0, 0.018]
    gripper_mode: 1
  - name: lift
    offset_xyz_m: [0.0, 0.0, 0.118]
    gripper_mode: 1
    arm: [0.8, 1.0]
    min_lift_height_m: 0.04
  - name: above_place
    offset_xyz_m: [0.0, 0.0, 0.118]
    gripper_mode: 1
    arm: [0.8, 1.0]
  - name: place
    offset_xyz_m: [0.0, 0.0, 0.018]
    gripper_mode: 1
    arm: [0.8, 1.0]
  - name: release
    offset_xyz_m: [0.0, 0.0, 0.018]
    gripper_mode: 0
  - name: retract
    offset_xyz_m: [0.0, 0.0, 0.098]
    gripper_mode: 0
