# yaml-language-server: $schema=./schema.json
# Close along world Y, near the home jaw orientation. The 35-degree tilt
# from vertical clears the elbow while avoiding a large initial wrist turn.
euler_xyz_degrees: [145.0, 0.0, -90.0]
frame: grasp
arm_tolerance: 0.016
gripper_tolerance: 0.001
stages:
  - name: above_pick
    # Back off 90 mm along the tool axis to keep the approach near the home pose.
    offset_xyz_m: [0.0516, 0.0, 0.0817]
    gripper_target_m: 0.0
  - name: pick
    # Back off 10 mm along the tool axis and raise 8 mm for finger-hull clearance.
    offset_xyz_m: [0.0057, 0.0, 0.0162]
    gripper_target_m: 0.0
  - name: close
    offset_xyz_m: [0.0057, 0.0, 0.0162]
    gripper_target_m: -0.02
    require_grasp: true
  - name: lift
    offset_xyz_m: [0.0057, 0.0, 0.1162]
    gripper_target_m: -0.02
    arm:
      velocity_limit: 0.8
    min_lift_height_m: 0.04
  - name: above_place
    offset_xyz_m: [0.0057, 0.0, 0.1162]
    gripper_target_m: -0.02
    arm:
      velocity_limit: 0.8
  - name: place
    offset_xyz_m: [0.0057, 0.0, 0.0162]
    gripper_target_m: -0.02
    arm:
      velocity_limit: 0.8
  - name: release
    offset_xyz_m: [0.0057, 0.0, 0.0162]
    gripper_target_m: 0.0
  - name: retract
    offset_xyz_m: [0.0516, 0.0, 0.0817]
    gripper_target_m: 0.0
