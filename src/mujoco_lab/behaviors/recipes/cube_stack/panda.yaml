frame: grasp
# Gripper mode: 1 closes; 0 fully opens.
# [velocity ratio, acceleration ratio] of configured robot limits.
# Arm ratios keep every joint below the previous absolute task limits.
arm: [0.766, 0.4]
arm_tolerance: 0.016
gripper_tolerance: 0.002
lost_grasp_grace_s: 0.25
stages:
  - name: above_pick
    offset_xyz_m: [0.0, 0.0, 0.23]
    gripper_mode: 0
  - name: pick
    offset_xyz_m: [0.0, 0.0, 0.02]
    gripper_mode: 0
  - name: close
    offset_xyz_m: [0.0, 0.0, 0.02]
    gripper_mode: 1
  - name: lift
    offset_xyz_m: [0.0, 0.0, 0.25]
    gripper_mode: 1
  - name: above_place
    offset_xyz_m: [0.0, 0.0, 0.26]
    gripper_mode: 1
  - name: place
    offset_xyz_m: [0.0, 0.0, 0.035]
    gripper_mode: 1
    arm: [0.306, 0.15]
  - name: release
    offset_xyz_m: [0.0, 0.0, 0.035]
    gripper_mode: 0
  - name: retract
    offset_xyz_m: [0.0, 0.0, 0.26]
    gripper_mode: 0
