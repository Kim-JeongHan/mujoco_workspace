# yaml-language-server: $schema=./schema.json
frame: grasp
arm:
  velocity_limit: 2.0 # rad/s; task tuning, not a motor rating
  acceleration_limit: 8.0 # rad/s^2
arm_tolerance: 0.016
gripper_tolerance: 0.001
stages:
  - name: above_pick
    offset_xyz_m: [0.0, 0.0, 0.23]
    gripper_target_m: 0.04
  - name: pick
    offset_xyz_m: [0.0, 0.0, 0.02]
    gripper_target_m: 0.04
  - name: close
    offset_xyz_m: [0.0, 0.0, 0.02]
    gripper_target_m: 0.011
    require_grasp: true
  - name: lift
    offset_xyz_m: [0.0, 0.0, 0.25]
    gripper_target_m: 0.011
  - name: above_place
    offset_xyz_m: [0.0, 0.0, 0.26]
    gripper_target_m: 0.011
  - name: place
    offset_xyz_m: [0.0, 0.0, 0.035]
    gripper_target_m: 0.011
    arm:
      velocity_limit: 0.8
      acceleration_limit: 3.0
  - name: release
    offset_xyz_m: [0.0, 0.0, 0.035]
    gripper_target_m: 0.04
  - name: retract
    offset_xyz_m: [0.0, 0.0, 0.26]
    gripper_target_m: 0.04
