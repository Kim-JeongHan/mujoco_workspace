name: CI

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      TORCHINDUCTOR_COMPILE_THREADS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Check lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked --dev --extra learning --extra viewer

      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Ruff format
        run: uv run --no-sync ruff format --check .

      - name: Type check
        # Type-check production modules and examples. Ruff still checks scripts
        # and tests; pytest exercises test doubles.
        run: |
          uv run --no-sync python -c "import runpy; runpy.run_path('typings/mujoco/__init__.pyi')"
          uv run --no-sync ty check src examples

      - name: Run tests
        run: uv run --no-sync pytest
