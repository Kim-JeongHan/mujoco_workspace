[project]
name = "mujoco-lab"
version = "0.1.0"
description = "MuJoCo workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10",
    "mujoco==3.13.0",
    "mujoco-warp==3.13.0",
    "numpy>=1.26",
    "pillow>=10",
    "pyqt6>=6.11.0",
    "scipy>=1.18.1",
]

[project.scripts]
mujoco-lab = "mujoco_lab.cli:main"

[dependency-groups]
asset-import = [
    "pycollada>=0.9.3",
    "pyyaml>=6.0.3",
    "trimesh>=5.1.0",
    "xacro>=2.1.1",
]
dev = ["pytest>=8", "ruff>=0.9"]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["examples/**", "scripts/**", "tests/**", "third_party/**", "uv.lock", ".python-version"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I"]
